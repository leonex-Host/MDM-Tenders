<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>MDM Extension</title>
  <style>
    :root {
      --bg: #0b0f19;
      --glass: rgba(255, 255, 255, 0.04);
      --glass-border: rgba(255, 255, 255, 0.08);
      --glass-hover: rgba(255, 255, 255, 0.08);
      --accent: #3b82f6;
      --accent-dim: rgba(59, 130, 246, 0.2);
      --text: #f8fafc;
      --text-dim: #94a3b8;
      --danger: #ef4444;
      --warning: #f59e0b;
      --success: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 360px;
      min-height: 480px;
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      overflow-x: hidden;
      position: relative;
    }

    /* Glassmorphism Background Blobs */
    .blob-1,
    .blob-2 {
      position: absolute;
      border-radius: 50%;
      filter: blur(60px);
      z-index: 0;
      pointer-events: none;
    }

    .blob-1 {
      width: 200px;
      height: 200px;
      background: rgba(59, 130, 246, 0.15);
      top: -100px;
      right: -50px;
    }

    .blob-2 {
      width: 150px;
      height: 150px;
      background: rgba(16, 185, 129, 0.1);
      bottom: -50px;
      left: -50px;
    }

    .container {
      position: relative;
      z-index: 1;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--glass-border);
      padding-bottom: 16px;
    }

    .header-logo {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--glass);
      padding: 6px 10px;
      border-radius: 12px;
      border: 1px solid var(--glass-border);
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-dim);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--danger);
      transition: all 0.3s ease;
    }

    .status-connected .status-dot {
      background: var(--success);
      box-shadow: 0 0 10px var(--success);
    }

    .status-connected {
      color: var(--success);
      border-color: rgba(16, 185, 129, 0.3);
    }

    /* Forms */
    .glass-panel {
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 16px;
      backdrop-filter: blur(10px);
    }

    .form-group {
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .form-group:last-child {
      margin-bottom: 0;
    }

    label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-dim);
    }

    input {
      width: 100%;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--glass-border);
      color: var(--text);
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-dim);
    }

    button {
      width: 100%;
      padding: 12px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
      box-shadow: 0 4px 14px var(--accent-dim);
    }

    button:hover {
      transform: translateY(-1px);
      filter: brightness(1.1);
    }

    button:active {
      transform: translateY(1px);
    }

    .btn-warning {
      background: var(--warning);
      color: #000;
      box-shadow: 0 4px 14px rgba(245, 158, 11, 0.2);
    }

    .btn-danger {
      background: rgba(239, 68, 68, 0.1);
      color: var(--danger);
      border: 1px solid rgba(239, 68, 68, 0.3);
      box-shadow: none;
    }

    .btn-danger:hover {
      background: rgba(239, 68, 68, 0.2);
    }

    /* Live Metrics */
    .metrics-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 12px;
    }

    .metric-box {
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid var(--glass-border);
      border-radius: 10px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .metric-label {
      font-size: 10px;
      color: var(--text-dim);
      text-transform: uppercase;
      font-weight: 600;
    }

    .metric-val {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .metric-val.highlight {
      color: var(--success);
    }

    /* Console */
    .logs-wrapper {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      overflow: hidden;
    }

    .logs-header {
      background: rgba(255, 255, 255, 0.02);
      padding: 6px 12px;
      font-size: 10px;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 700;
      border-bottom: 1px solid var(--glass-border);
      display: flex;
      justify-content: space-between;
    }

    .logs {
      padding: 12px;
      font-size: 11px;
      color: var(--text-dim);
      font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace;
      height: 60px;
      overflow-y: auto;
      line-height: 1.5;
    }
  </style>
</head>

<body>
  <div class="blob-1"></div>
  <div class="blob-2"></div>

  <div class="container">
    <div class="header">
      <div class="header-logo">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" style="color: var(--accent)">
          <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
          <polyline points="2 17 12 22 22 17"></polyline>
          <polyline points="2 12 12 17 22 12"></polyline>
        </svg>
        MDM Extension
      </div>
      <div class="status-indicator" id="status_indicator">
        <div class="status-dot"></div>
        <span id="status_text">Offline</span>
      </div>
    </div>

    <!-- Metrics Panel (Hidden by default) -->
    <div class="glass-panel" id="metrics_panel" style="display:none; border-color: rgba(16, 185, 129, 0.3);">
      <div
        style="font-size:12px; font-weight:700; color:var(--success); margin-bottom:4px; display:flex; align-items:center; gap:6px;">
        <div class="status-dot" style="background:var(--success); box-shadow:0 0 8px var(--success)"></div> Scraper
        Active
      </div>
      <div class="metrics-grid">
        <div class="metric-box">
          <span class="metric-label">Target Engine</span>
          <span class="metric-val" id="m_source">--</span>
        </div>
        <div class="metric-box">
          <span class="metric-label">Extracted</span>
          <span class="metric-val highlight" id="m_extracted">0</span>
        </div>
        <div class="metric-box" style="grid-column: span 2;">
          <span class="metric-label">Phase / Keyword</span>
          <span class="metric-val" id="m_phase_kwd" style="font-size: 13px;">--</span>
        </div>
      </div>

      <button id="resume_btn" class="btn-warning" style="display:none; margin-top: 16px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polygon points="5 3 19 12 5 21 5 3"></polygon>
        </svg>
        Resume Blocked Job
      </button>

      <button id="abort_btn" class="btn-danger" style="display:none; margin-top: 8px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="9" y1="9" x2="15" y2="15"></line>
          <line x1="15" y1="9" x2="9" y2="15"></line>
        </svg>
        Abort Local Job
      </button>
    </div>

    <!-- Configuration Panel -->
    <div class="glass-panel" id="config_panel">
      <div class="form-group">
        <label>Render Hub URL</label>
        <input type="text" id="api_url" placeholder="https://mdm-tenders.onrender.com" autocomplete="off" />
      </div>
      <div class="form-group">
        <label>Extension Security Key</label>
        <input type="password" id="api_key" placeholder="Enter secure key..." autocomplete="off" />
      </div>
      <button id="save_btn" style="margin-top: 8px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
          <polyline points="17 21 17 13 7 13 7 21"></polyline>
          <polyline points="7 3 7 8 15 8"></polyline>
        </svg>
        Authenticate & Link
      </button>
    </div>

    <!-- Terminal -->
    <div class="logs-wrapper">
      <div class="logs-header">
        <span>Terminal Output</span>
        <span id="log_time"></span>
      </div>
      <div class="logs" id="logs">Booting MDM Extension Kernel...</div>
    </div>

  </div>

  <script src="popup.js"></script>
</body>

</html>
