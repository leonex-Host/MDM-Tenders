<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>MDM Scraper Settings</title>
  <style>
    :root {
      --bg: #0d1117;
      --bg-card: rgba(255, 255, 255, 0.02);
      --border: rgba(255, 255, 255, 0.1);
      --text: #e5e7eb;
      --text-dim: #9ca3af;
      --accent: #3b82f6;
    }

    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
    }

    h2 {
      margin: 0 0 16px 0;
      font-size: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ef4444;
      /* red default */
    }

    .status-connected {
      background: #10b981;
      box-shadow: 0 0 8px #10b981;
    }

    .form-group {
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-dim);
    }

    input {
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 13px;
      outline: none;
    }

    input:focus {
      border-color: var(--accent);
    }

    button {
      width: 100%;
      padding: 10px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
    }

    button:hover {
      filter: brightness(1.1);
    }

    .logs {
      margin-top: 16px;
      padding: 8px;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 6px;
      font-size: 11px;
      color: var(--text-dim);
      font-family: monospace;
      height: 60px;
      overflow-y: auto;
    }
  </style>
</head>

<body>
  <h2>
    <div class="status-dot" id="dot"></div> MDM Local Agent
  </h2>

  <div class="form-group">
    <label>Render API URL</label>
    <input type="text" id="api_url" placeholder="https://mdm-tenders-mo22.onrender.com" />
  </div>

  <div class="form-group">
    <label>Extension Key</label>
    <input type="password" id="api_key" placeholder="Enter secure key..." />
  </div>

  <button id="save_btn">Save & Connect</button>
  <button id="resume_btn" style="display:none; background: #eab308; color: black; margin-top: 8px;">Resume Paused
    Job</button>
  <button id="abort_btn" style="display:none; background: #ef4444; color: white; margin-top: 8px;">&#9746; Abort Current
    Job</button>

  <div class="logs" id="logs">Extension loaded.</div>

  <script src="popup.js"></script>
</body>

</html>
