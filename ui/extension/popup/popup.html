<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>MDM Agent Control</title>
  <style>
    :root {
      --bg: #0d1117;
      --bg-card: rgba(255, 255, 255, 0.03);
      --border: rgba(255, 255, 255, 0.08);
      --text: #e5e7eb;
      --text-dim: #6b7280;
      --accent: #3b82f6;
      --success: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 360px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 16px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .header h2 {
      font-size: 15px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--danger);
      flex-shrink: 0;
    }

    .dot.on {
      background: var(--success);
      box-shadow: 0 0 8px var(--success);
    }

    .badge {
      font-size: 9px;
      font-weight: 800;
      background: var(--accent);
      color: #fff;
      padding: 2px 8px;
      border-radius: 10px;
    }

    /* Config Panel */
    #config_panel {
      display: none;
    }

    #config_panel.show {
      display: block;
    }

    .form-group {
      margin-bottom: 10px;
    }

    .form-group label {
      display: block;
      font-size: 10px;
      font-weight: 700;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .form-group input {
      width: 100%;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 12px;
      outline: none;
    }

    .form-group input:focus {
      border-color: var(--accent);
    }

    .btn {
      width: 100%;
      padding: 10px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      font-size: 11px;
      cursor: pointer;
      margin-top: 4px;
    }

    .btn:hover {
      filter: brightness(1.15);
    }

    .btn-danger {
      background: var(--danger);
    }

    .btn-sm {
      width: auto;
      padding: 4px 10px;
      font-size: 9px;
      margin: 0;
    }

    /* Jobs Panel */
    #jobs_panel {
      display: none;
    }

    #jobs_panel.show {
      display: block;
    }

    .job-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 8px;
    }

    .job-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .job-source {
      font-size: 11px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .job-id {
      font-size: 9px;
      color: var(--text-dim);
      font-family: monospace;
    }

    .job-status {
      font-size: 9px;
      font-weight: 800;
      text-transform: uppercase;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .job-status.running {
      background: rgba(16, 185, 129, 0.15);
      color: var(--success);
    }

    .job-status.starting {
      background: rgba(245, 158, 11, 0.15);
      color: var(--warning);
    }

    .empty-state {
      text-align: center;
      padding: 24px;
      color: var(--text-dim);
      font-size: 11px;
      font-weight: 700;
    }

    .logs {
      margin-top: 12px;
      padding: 8px;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 8px;
      font-size: 10px;
      color: var(--text-dim);
      font-family: monospace;
      min-height: 30px;
    }

    .footer {
      margin-top: 12px;
      display: flex;
      gap: 8px;
    }
  </style>
</head>

<body>
  <div class="header">
    <h2>
      <div class="dot" id="dot"></div> MDM Agent
    </h2>
    <span class="badge" id="job_count">0 JOBS</span>
  </div>

  <!-- Config Panel (shown when no connection) -->
  <div id="config_panel" class="show">
    <div class="form-group">
      <label>Render API URL</label>
      <input type="text" id="api_url" placeholder="https://your-app.onrender.com" />
    </div>
    <div class="form-group">
      <label>Extension Key</label>
      <input type="password" id="api_key" placeholder="Enter secure key..." />
    </div>
    <button class="btn" id="save_btn">Save & Connect</button>
  </div>

  <!-- Jobs Panel (shown when connected) -->
  <div id="jobs_panel">
    <div id="jobs_list">
      <div class="empty-state">Polling for jobs...</div>
    </div>
    <div class="footer">
      <button class="btn btn-danger btn-sm" id="abort_btn" style="display:none;">ABORT ALL</button>
    </div>
  </div>

  <div class="logs" id="logs">Extension loaded.</div>

  <script src="popup.js"></script>
</body>

</html>
